name: Sync ballpark weather

on:
  schedule:
    - cron: '10 0,6,9,12,15,18,21 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm install
      - run: npm run sync-weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_ENJOY_CPBL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENJOY_CPBL }}
