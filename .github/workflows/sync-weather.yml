name: Sync ballpark weather

on:
  schedule:
    - cron: '10 5,8,11,14,17,20,23 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: npm install
      - run: npm run sync-weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_ENJOY_CPBL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENJOY_CPBL }}
